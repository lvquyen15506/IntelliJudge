# PostgreSQL Configuration
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=rosegarden

# Redis Configuration
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=rosegarden

# Judge0 Sandbox Settings (Disable isolate --cg requirement for WSL2)
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
MAX_QUEUE_SIZE=10000
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true

# Connection URLs
DATABASE_URL=postgresql://judge0:rosegarden@db:5432/judge0
REDIS_URL=redis://:rosegarden@redis:6379/0

# Worker Settings (Reduce CPU load by running 2 workers instead of default 24)
WORKER_COUNT=2
