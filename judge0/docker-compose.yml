version: '3.8'

services:
  server:
    image: judge0/judge0:1.13.0
    env_file: judge0.conf
    volumes:
      - ./judge0.conf:/etc/judge0.conf:ro
    tmpfs:
      - /box
      - /tmp
    ports:
      - "2358:2358"
    privileged: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - db
      - redis

  worker:
    image: judge0/judge0:1.13.0
    env_file: judge0.conf
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/etc/judge0.conf:ro
    tmpfs:
      - /box
      - /tmp
    privileged: true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - db
      - redis

  db:
    image: postgres:13.0
    env_file: judge0.conf
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6.0
    command: [ "bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"' ]
    env_file: judge0.conf
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
