name: IntelliJudge CD - Continuous Deployment

on:
  workflow_run:
    workflows: ["IntelliJudge CI & Release Verification"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-to-server:
    name: 🚀 Deploy to Remote VPS / Cloud Server
    # Chỉ triển khai khi workflow CI trước đó chạy THÀNH CÔNG (Success)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Deployment Status
        run: |
          echo "✅ CI Checks Passed Successfully!"
          echo "🚀 Triggering Continuous Deployment (CD) Pipeline for IntelliJudge..."
          echo "Target Environment: Production / Staging Server"

