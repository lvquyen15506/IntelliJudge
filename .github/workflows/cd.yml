name: IntelliJudge CD - Continuous Deployment

on:
  workflow_run:
    workflows: ["IntelliJudge CI & Release Verification"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-to-server:
    name: 🚀 Deploy to Remote VPS / Cloud Server
    # Chỉ triển khai khi workflow CI trước đó chạy THÀNH CÔNG (Success)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Deployment Status
        run: |
          echo "✅ CI Checks Passed Successfully!"
          echo "🚀 Triggering Continuous Deployment (CD) Pipeline for IntelliJudge..."
          echo "Target Environment: Production / Staging Server"

      - name: Deploy via SSH to GCP Cloud VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          script: |
            cd /www/wwwroot/nexusopsai.site/judge0 && docker compose up -d
            cd /www/wwwroot/nexusopsai.site
            git pull origin main
            NET_NAME=$(docker network ls --format '{{.Name}}' | grep -i intellijudge | head -n 1)
            [ -n "$NET_NAME" ] && docker network connect "$NET_NAME" judge0-server-1 2>/dev/null || true
            docker compose up -d --build --force-recreate backend celery_worker frontend
            [ -n "$NET_NAME" ] && docker network connect "$NET_NAME" judge0-server-1 2>/dev/null || true
